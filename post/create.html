<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New article - Newsline</title>
    <meta name="description" content="Submit a new article to Newsline." />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      <nav class="container nav">
        <a href="../" class="logo" aria-label="Newsline - Home">
          <svg viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="21" x2="200" y2="21" stroke="#0EA5E9" stroke-width="3.5"/>
            <text x="8" y="29" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="24" letter-spacing="-0.5" fill="#0F172A" paint-order="stroke" stroke="#F8FAFC" stroke-width="1.5">Newsline</text>
          </svg>
        </a>
        <div class="nav-links" id="nav-links">
          <a href="../account/login.html">Log in</a>
          <a href="../account/register.html">Register</a>
        </div>
      </nav>
    </header>

    <main class="container" id="main">
      <div class="form-wrapper form-wrapper-wide">
        <h1>New article</h1>

        <form id="create-post-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required minlength="3" maxlength="150" />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Choose a category</option>
              <option value="World">World</option>
              <option value="Politics">Politics</option>
              <option value="Business">Business</option>
              <option value="Technology">Technology</option>
              <option value="Sports">Sports</option>
              <option value="Culture">Culture</option>
            </select>
          </div>

          <div class="form-group">
            <label for="body">Article text</label>
            <textarea id="body" name="body" required minlength="20"></textarea>
            <small class="form-hint">At least 20 characters. Leave an empty line between paragraphs.</small>
          </div>

          <div id="error-message" class="error-message" aria-live="polite"></div>
          <div id="success-message" class="success-message" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary">Publish</button>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Newsline</p>
    </footer>

    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="../js/create-post.js"></script>
  </body>
</html>
