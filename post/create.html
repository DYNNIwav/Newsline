<!doctype html>
<html lang="nn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opprett nyheit - Newsline</title>
    <meta name="description" content="Opprett ei ny nyheit på Newsline." />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Hopp til innhald</a>
    <header>
      <nav class="container nav">
        <a href="../" class="logo" aria-label="Newsline - Heim">
          <svg viewBox="0 0 150 32" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="6" width="20" height="20" rx="3" fill="#10B981"/>
            <text x="30" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#FAFAF9">Newsline</text>
          </svg>
        </a>
        <div class="nav-links" id="nav-links">
          <a href="../account/login.html">Logg inn</a>
          <a href="../account/register.html">Registrer</a>
        </div>
      </nav>
    </header>

    <main class="container" id="main">
      <div class="form-wrapper form-wrapper-wide">
        <h1>Opprett nyheit</h1>

        <form id="create-post-form">
          <div class="form-group">
            <label for="title">Tittel</label>
            <input type="text" id="title" name="title" required minlength="3" maxlength="150" />
          </div>

          <div class="form-group">
            <label for="category">Kategori</label>
            <select id="category" name="category" required>
              <option value="">Vel kategori</option>
              <option value="Noreg">Noreg</option>
              <option value="Verda">Verda</option>
              <option value="Politikk">Politikk</option>
              <option value="Økonomi">Økonomi</option>
              <option value="Teknologi">Teknologi</option>
              <option value="Sport">Sport</option>
              <option value="Kultur">Kultur</option>
            </select>
          </div>

          <div class="form-group">
            <label for="body">Innhald</label>
            <textarea id="body" name="body" required minlength="20"></textarea>
            <small class="form-hint">Minst 20 teikn. Legg inn ei tom linje mellom avsnitta.</small>
          </div>

          <div id="error-message" class="error-message" aria-live="polite"></div>
          <div id="success-message" class="success-message" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary">Publiser</button>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Newsline</p>
    </footer>

    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="../js/create-post.js"></script>
  </body>
</html>
