<!doctype html>
<html lang="nn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logg inn - Newsline</title>
    <meta name="description" content="Logg inn på Newsline." />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Hopp til innhald</a>
    <header>
      <nav class="container nav">
        <a href="../" class="logo" aria-label="Newsline - Heim">
          <svg viewBox="0 0 150 32" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="6" width="20" height="20" rx="3" fill="#10B981"/>
            <text x="30" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#FAFAF9">Newsline</text>
          </svg>
        </a>
        <div class="nav-links" id="nav-links">
          <a href="../account/login.html">Logg inn</a>
          <a href="../account/register.html">Registrer</a>
        </div>
      </nav>
    </header>

    <main class="container" id="main">
      <div class="form-wrapper">
        <h1>Logg inn</h1>

        <form id="login-form">
          <div class="form-group">
            <label for="email">E-post</label>
            <input type="email" id="email" name="email" required placeholder="namn@eksempel.no" />
          </div>

          <div class="form-group">
            <label for="password">Passord</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div id="error-message" class="error-message" aria-live="polite"></div>
          <div id="success-message" class="success-message" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary">Logg inn</button>
        </form>

        <p class="form-footer">
          Har du ingen konto? <a href="./register.html">Registrer</a>
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Newsline</p>
    </footer>

    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
