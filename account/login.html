<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Newsline</title>
    <meta name="description" content="Log in to Newsline." />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      <nav class="container nav">
        <a href="../" class="logo" aria-label="Newsline - Home">
          <svg viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="21" x2="200" y2="21" stroke="#0EA5E9" stroke-width="3.5"/>
            <text x="8" y="29" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="24" letter-spacing="-0.5" fill="#0F172A" paint-order="stroke" stroke="#F8FAFC" stroke-width="1.5">Newsline</text>
          </svg>
        </a>
        <div class="nav-links" id="nav-links">
          <a href="../account/login.html">Log in</a>
          <a href="../account/register.html">Register</a>
        </div>
      </nav>
    </header>

    <main class="container" id="main">
      <div class="form-wrapper">
        <h1>Log in</h1>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div id="error-message" class="error-message" aria-live="polite"></div>
          <div id="success-message" class="success-message" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <p class="form-footer">
          No account yet? <a href="./register.html">Register</a>
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Newsline</p>
    </footer>

    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
